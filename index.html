<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Camera — Gesture Blur</title>
  
  <!-- Modern Clean Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Clean Minimalist Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-title">Focus Cam</span>
        <div id="status-badge" class="status-badge status-offline">
          <span class="status-dot"></span>
          <span id="status-text">Kamera Mati</span>
        </div>
      </div>
      <p class="app-description">Kamera otomatis buram saat gestur 2 jari (✌️) terdeteksi.</p>
    </header>

    <!-- Main Viewport -->
    <main id="viewport" class="viewport-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>

      <!-- Minimalist Overlay -->
      <div id="overlay" class="overlay">
        <div id="spinner" class="spinner"></div>
        <p id="overlay-text" class="overlay-text">Siap memulai...</p>
      </div>
    </main>

    <!-- Toolbar Controls -->
    <div class="control-bar">
      <button id="btn-start" class="btn btn-primary">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Mulai Kamera
      </button>
      <button id="btn-stop" class="btn btn-secondary" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
        Hentikan
      </button>
    </div>
  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
